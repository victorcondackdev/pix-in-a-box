name: e2e

# Builds every component from its repository, starts the whole stack and
# runs the narrated scenarios as assertions. Any failed expectation fails
# the job; the logs of every container are attached to the run.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Stack status
        if: always()
        run: docker compose ps -a

      - name: Run the scenarios
        run: ./scripts/demo.sh --assert

      - name: Metrics snapshot
        if: always()
        run: |
          for svc in gateway:8080 riskd:8083 relayd:8084 payments:8082 notifier:8085 merchant:8070; do
            echo "== ${svc%%:*}"; curl -fsS "localhost:${svc##*:}/metrics" | grep -v '^#' | head -60 || true
          done

      - name: Collect logs
        if: failure()
        run: docker compose logs --no-color --timestamps > compose-logs.txt

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt

      - name: Dump logs to the job output
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
