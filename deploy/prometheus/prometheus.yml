# Scrapes every component that exposes Prometheus metrics. The simulator
# (pix-psp-simulator) has no /metrics endpoint; its activity is visible
# through the gateway's downstream and SPI webhook metrics.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["gateway:8080"] }]
  - job_name: riskd
    static_configs: [{ targets: ["riskd:8080"] }]
  - job_name: relayd
    static_configs: [{ targets: ["relayd:8080"] }]
  - job_name: payments-service
    static_configs: [{ targets: ["payments:8080"] }]
  - job_name: notifier
    static_configs: [{ targets: ["notifier:8080"] }]
  - job_name: merchant
    static_configs: [{ targets: ["merchant:8080"] }]
